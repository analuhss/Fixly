<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="./css/style2.css">
    <link rel="icon" type="image/svg+xml" href="./files/svg/aplicativo/icone.svg">

    <!-- FONTES -->
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

</head>

<body>
    <main>
        <div class="esquerda">
            <h2>Manutenção descomplicada a um toque de distância.</h2>
        </div>

        <div class="direita">

            <img class="logo" src="./files/svg/aplicativo/fixly.svg" alt="Logo do site fixly">

            <form class="login">
                <div class="input">
                    <div class="campo email">
                        <label for="email" class="visual">E-mail</label>
                        <input class="info" type="email" id="email" name="email" placeholder="email">
                    </div>
                    <div class="campo senha">
                        <label for="password" class="visual">Senha</label>
                        <input class="info" type="password" id="password" name="password" placeholder="senha">
                    </div>

                    <div class="recomendacao">
                        <p><span class="destaque">Escolha uma senha forte!</span></p>
                        <p>Letras maiúsculas, minúsculas, números e caracteres especiais</p>
                    </div>
                </div>

                <div class="entar">
                    <button type="submit">Criar</button>
                </div>
            </form>

            <div class="ou">
                <p>ou</p>
            </div>

            <div class="footerconta">
                <p>Já tem uma conta?</p>
                <a href="./index.html">Entre</a>
            </div>
        </div>
    </main>
</body>

</html>
