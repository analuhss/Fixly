<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Fixly – Ordens de Serviço</title>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;800&family=Space+Mono&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/inicioFG.css">
</head>

<body>
    <div class="wrap">
        <header class="nav">
            <div class="in">
                <a href="#" style="--x:105">INÍCIO</a>
                <a href="#" class="on" style="--x:330" aria-current="page">ORDENS</a>
                <a href="#" style="--x:581">SERVIÇOS</a>
                <a href="#" style="--x:843">CONVERSAS</a>
                <div class="avatar" aria-label="Perfil"><svg viewBox="0 0 92 92">
                        <circle cx="46" cy="34" r="17" fill="#111" />
                        <path d="M14 80c0-18 14-27 32-27s32 9 32 27c-9 8-20 12-32 12s-23-4-32-12z" fill="#111" />
                    </svg></div>
            </div>
        </header>

        <main class="in">
            <h1>Ordens de <span>Serviço</span></h1>
            <p class="sub mono">Acompanhe as ordens de serviço</p>

            <div class="search">
                <input id="q" type="search" placeholder="pesquisa" aria-label="Pesquisar ordens">
                <button aria-label="Filtros"></button>
            </div>

            <div class="add"><button aria-label="Nova ordem de serviço"><svg viewBox="0 0 46 46" stroke="#fff"
                        stroke-width="8" stroke-linecap="round">
                        <path d="M23 4v38M4 23h38" />
                    </svg></button></div>
            <hr>

            <div class="filters" id="f" role="group" aria-label="Status">
                <button data-s="todas" aria-pressed="true">TODAS</button>
                <button data-s="aberta" aria-pressed="false">ABERTAS</button>
                <button data-s="andamento" aria-pressed="false">ANDAMENTO</button>
                <button data-s="fechada" aria-pressed="false">FECHADAS</button>
                <button data-s="congelada" aria-pressed="false">CONGELADAS</button>
            </div>

            <section class="grid" id="g" aria-live="polite"></section>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
