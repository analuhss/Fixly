<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- CONEXÕES -->   
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/script.js" defer></script>

    <!-- LINK PARA ICON -->

</head>
<body>
    <main>
        <div class="card">
            <div class="logo">
                <img 
                src="./files/svg/fixly.svg" 
                alt="Logo do Fixly">
            </div>

            <div class="título">
                <p>Bem vindo de volta!</p>
            </div>

            <form action="" class="login">
                <div class="input">
                    <div>
                        <label for="email">E-mail</label>
                        <input class="info" type="email" id="email" name="email" placeholder="E-mail" required>
                    </div>

                    <div>
                        <label for="password">Senha</label>
                        <input type="password" class="info" id="password" name="password" placeholder="Senha">
                    </div>
                </div>
                
                <div class="entrar">
                    <button type="submit">Entrar</button>
                </div>

            </form>

            <div class="ou"><p>ou</p></div>
            
            <div class="footer">
                <p>Ainda não tem uma conta?</p>
                <a href="./criarConta.html">Crie uma</a>
            </div>
        </div>
    </main>
</body>
</html>
