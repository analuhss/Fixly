<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixly</title>
    <link rel="icon" type="image/svg" href="./files/svg/icone.svg">
    <link rel="stylesheet" href="./css/style.css">

</head>
<body>
    <main>
        

        <div class="card">
            <div class="logo">
                <img src="./files/svg/fixly.svg" alt="Logo do Fixly">
            </div>
            
            <div class="boas">
                <p>Bem vindo(a) de volta!</p>
            </div>

            <div class="input">
                
                <div >
                    <input class="info" type="email" id="email" name="email" placeholder="email">
                </div>
                <div >
                    <input class="info" type="password" name="password" id="password" placeholder="senha">
                </div>

            </div>

            <div class="entar">
                <button type="submit">Entar</button>
            </div>

            <div class="ou"><p>ou</p></div>

            <div class="footerconta">
                <p>Ainda não tem uma conta?</p>
                <a href="./criarConta.html">Crie uma</a>
            </div>

            
        </div>
    </main>

</html>
