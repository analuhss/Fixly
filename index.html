<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixly</title>
    <link rel="icon" type="image/svg+xml" href="./files/svg/aplicativo/icone.svg">
    <link rel="stylesheet" href="./css/style.css">
    <script src="./script.js"></script>

    <!-- FONTES -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

</head>
<body>
    <main>
        <div class="card">
            <div class="logo">
                <img src="./files/svg/aplicativo/fixly.svg" alt="Logo do Fixly">
            </div>
            
            <div class="boas">
                <p class="boas">Bem-vindo(a) de volta!</p>
            </div>
            
            <form class="login">
                <div class="input">
                    <div>
                        <label for="email" class="visual">E-mail</label>
                        <input class="info" type="email" id="email" name="email" placeholder="email" required>
                    </div>
                    <div>
                        <label for="password" class="visual">Senha</label>
                        <input class="info" type="password" id="password" name="password" placeholder="senha" required minlength="6">
                    </div>
                </div>
                
                <div class="entar">
                    <button id="entrar" type="submit">Entrar</button>
                </div>
            </form>
            
            <div class="ou"><p>ou</p></div>

            <div class="footerconta">
                <p>Ainda não tem uma conta?</p>
                <a href="./criarConta.html">Crie uma</a>
            </div>

        </div>
    </main>
</body>
</html>
