<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>


    <!-- REFERÊNCIA COM A API -->
    <script src="../js/perfil.js" defer></script>


    <!-- FONTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">


    <!-- REFERÊNCIA COM O CSS -->
    <link rel="stylesheet" href="../css/perfil.css">


    <!-- ÍCONE -->
    <link rel="icon" type="image/svg+xml" href="../files/svg/ícone.svg">
</head>
<body>


    <header class="topbar">
        <a href="inicio.html" class="topbar__logo">
            <img src="../files/svg/logo.svg" alt="Fixly" height="30">
        </a>
        <nav class="topbar__nav" aria-label="Principal">
            <a href="inicio.html">Início</a>
            <a href="ordens.html">Ordens</a>
            <a href="conversas.html">Conversas</a>
        </nav>
        <a href="perfil.html" class="topbar__avatar" aria-label="Meu perfil" aria-current="page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2c-4 0-8 2-8 5v1h16v-1c0-3-4-5-8-5Z"/></svg>
        </a>
    </header>


    <!-- ID'S IMPORTANTES -->
    <!-- Formulário: perfil -->
    <!-- Nome completo: nome -->
    <!-- CPF: cpf -->
    <!-- Data de aniversário: nascimento -->
    <!-- Celular: telefone -->
    <!-- E-mail: email -->
    <!-- Senha: senha -->
    <!-- CEP: cep -->
    <!-- Endereço: endereco -->
    <!-- Foto: foto -->


    <form class="perfil" action="#" id="perfil">


        <div class="card">


            <div class="avatar">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2c-4 0-8 2-8 5v1h16v-1c0-3-4-5-8-5Z"/></svg>
                <label class="avatar__edit" for="foto" aria-label="Alterar foto">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l1.5-2h7L17 7h3v12H4V7Zm8 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/></svg>
                </label>
                <input type="file" id="foto" name="foto" accept="image/*" hidden>
            </div>


            <h1 id="nome-exibido">Anônimo</h1>
            <p class="local">São Paulo, Guarulhos</p>


            <div class="divisor"><span>Dados pessoais</span></div>


            <div class="grid">
                <div class="campo largo">
                    <label for="nome">Nome Completo</label>
                    <div class="input">
                        <input type="text" id="nome" name="nome" placeholder="Nome" autocomplete="name" readonly>
                        <button type="button" class="editar" data-alvo="nome" aria-label="Editar nome"></button>
                    </div>
                </div>


                <div class="campo">
                    <label for="cpf">CPF</label>
                    <div class="input">
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" inputmode="numeric" maxlength="14" readonly>
                        <button type="button" class="editar" data-alvo="cpf" aria-label="Editar CPF"></button>
                    </div>
                </div>


                <div class="campo">
                    <label for="nascimento">Data aniversário</label>
                    <div class="input">
                        <input type="date" id="nascimento" name="nascimento" autocomplete="bday" readonly>
                        <button type="button" class="editar" data-alvo="nascimento" aria-label="Editar data de aniversário"></button>
                    </div>
                </div>


                <div class="campo">
                    <label for="telefone">Telefone ou celular</label>
                    <div class="input">
                        <input type="tel" id="telefone" name="telefone" placeholder="(DDD) Telefone" autocomplete="tel" readonly>
                        <button type="button" class="editar" data-alvo="telefone" aria-label="Editar telefone"></button>
                    </div>
                </div>


                <div class="campo">
                    <label for="email">E-mail</label>
                    <div class="input">
                        <input type="email" id="email" name="email" placeholder="email" autocomplete="email" readonly>
                        <button type="button" class="editar" data-alvo="email" aria-label="Editar e-mail"></button>
                    </div>
                </div>


                <div class="campo">
                    <label for="cep">CEP</label>
                    <div class="input">
                        <input type="text" id="cep" name="cep" placeholder="00000-000" inputmode="numeric" maxlength="9" autocomplete="postal-code" readonly>
                        <button type="button" class="editar" data-alvo="cep" aria-label="Editar CEP"></button>
                    </div>
                </div>


                <div class="campo">
                    <label for="endereco">Endereço</label>
                    <div class="input">
                        <input type="text" id="endereco" name="endereco" placeholder="Rua, Bairro., Número" autocomplete="street-address" readonly>
                        <button type="button" class="editar" data-alvo="endereco" aria-label="Editar endereço"></button>
                    </div>
                </div>


                <div class="campo largo">
                    <label for="senha">Senha</label>
                    <div class="input">
                        <input type="password" id="senha" name="senha" placeholder="senha" value="" autocomplete="current-password" readonly>
                        <button type="button" class="editar" data-acao="senha" aria-label="Alterar senha"></button>
                    </div>
                </div>
            </div>
        </div>


        <div class="acoes">
            <button type="submit" id="salvar" disabled>Salvar alterações</button>
            <button type="button" id="alterar-senha" class="secundario">Alterar senha</button>
        </div>
    </form>
</body>
</html>
