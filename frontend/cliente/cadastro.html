<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro</title>

    <!-- REFERÊNCIA COM A API -->
    <script src="../js/cadastro.js" defer></script>

    <!-- FONTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- REFERÊNCIA COM O CSS -->
    <link rel="stylesheet" href="../css/cadastro.css">

    <!-- ÍCONE -->
    <link rel="icon" type="image/svg+xml" href="../files/svg/ícone.svg">

</head>
<body>
    <form class="cadastro" action="#" id="cadastro">

        <div class="card">
            <h1>Complete seu cadastro</h1>
            <p class="subtitulo">Falta pouco! Preencha seus dados para continuar.</p>

            <!-- ID'S IMPORTANTES -->
            <!-- Formulário: cadastro -->
            <!-- Nome completo: nome -->
            <!-- CPF: cpf -->
            <!-- Data de aniversário: nascimento -->
            <!-- Celular: telefone -->
            <!-- CEP: cep -->
            <!-- Endereço: endereco -->

            <div class="grid">
                <h2 class="secao">Dados pessoais</h2>

                <div class="campo largo">
                    <label for="nome">Nome Completo <span class="obrig" aria-hidden="true">*</span></label>
                    <input type="text" id="nome" name="nome" placeholder="Nome completo" autocomplete="name" required>
                </div>

                <div class="campo largo">
                    <label for="cpf">CPF <span class="obrig" aria-hidden="true">*</span></label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" inputmode="numeric" maxlength="14" pattern="\d{3}\.?\d{3}\.?\d{3}-?\d{2}" title="Digite os 11 números do CPF" required>
                </div>

                <div class="campo largo">
                    <label for="nascimento">Data aniversário <span class="opcional">(opcional)</span></label>
                    <input type="date" id="nascimento" name="nascimento" autocomplete="bday">
                </div>

                <div class="campo largo">
                    <label for="telefone">Telefone ou celular <span class="obrig" aria-hidden="true">*</span></label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(DDD) Telefone" autocomplete="tel" required>
                </div>

                <h2 class="secao">Endereço</h2>

                <div class="campo">
                    <label for="cep">CEP <span class="opcional">(opcional)</span></label>
                    <input type="text" id="cep" name="cep" placeholder="00000-000" inputmode="numeric" maxlength="9" pattern="\d{5}-?\d{3}" title="Digite os 8 números do CEP" autocomplete="postal-code">
                </div>

                <div class="campo">
                    <label for="endereco">Endereço <span class="opcional">(opcional)</span></label>
                    <input type="text" id="endereco" name="endereco" placeholder="Rua, Bairro, Número" autocomplete="street-address">
                </div>
            </div>

            <p class="legenda"><span class="obrig" aria-hidden="true">*</span> Campos obrigatórios</p>
        </div>

        <button type="submit" class="botao">Concluir cadastro</button>

        <!-- espaço para avisos (o cadastro.js pode escrever aqui) -->
        <p class="mensagem" id="mensagem" role="status"></p>
    </form>
</body>
</html>
