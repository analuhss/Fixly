<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">

    
    <link rel="stylesheet" href="../css/perfil.css">
    <link rel="icon" type="image/svg+xml" href="./files/svg/aplicativo/icone.svg">
</head>
<body>
     <header class="navbar">
        <a class="logo" href="./inicio.html">
            <img src="../files/svg/fixly.svg" alt="Logo do site fixly">
        </a>

        <nav class="menu">
            <a href="./inicio.html">Início</a>
            <a href="./ordens.html">Ordens</a>
            <a href="./conversas.html" class="ativo" aria-current="page">Conversas</a>
        </nav>

        <a class="perfil" href="./perfil.html" aria-label="Perfil">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <circle cx="12" cy="8.5" r="4.2"/>
                <path d="M3.5 22c0-4.7 3.8-7.5 8.5-7.5s8.5 2.8 8.5 7.5z"/>
            </svg>
        </a>
    </header>

    <main>
        <section class="cartao">
            <div class="avatar"></div>

            <div class="info">
                <h1>Anônimo</h1>
                <p>São Paulo, Guarulhos</p>
            </div>

            <div class="divisor"></div>

            <form action="#">
                <div class="campo">
                    <label for="nome">Nome</label>
                    <div class="caixa">
                        <input type="text" id="nome" name="nome" placeholder="Nome">
                    </div>
                </div>

                <div class="campo">
                    <label for="cpf">CPF</label>
                    <div class="caixa">
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" inputmode="numeric" maxlength="14">
                    </div>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <div class="caixa">
                        <input type="email" id="email" name="email" placeholder="email">
                    </div>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <div class="caixa">
                        <input type="password" id="senha" name="senha" placeholder="senha">
                    </div>
                </div>

                <button type="button" class="botao">Alterar senha</button>
            </form>
        </section>
    </main>
</body>
</html>
