<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordens de Serviço</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/ordensC.css">
    <link rel="icon" type="image/svg+xml" href="../files/svg/ícone.svg">
</head>
<body>
    <header class="navbar">
        <a class="logo" href="./inicio.html">
            <img src="../files/svg/fixly.svg" alt="Logo do site fixly">
        </a>

        <nav class="menu">
            <a href="/home-c">Início</a>
            <a href="/ordensC" class="ativo" aria-current="page">Ordens</a>
            <a href="/conversa-c">Conversas</a>
        </nav>

        <a class="perfil" href="./perfil.html" aria-label="Perfil">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <circle cx="12" cy="8.5" r="4.2"/>
                <path d="M3.5 22c0-4.7 3.8-7.5 8.5-7.5s8.5 2.8 8.5 7.5z"/>
            </svg>
        </a>
    </header>

    <main>
        <h1>Ordens de <span>Serviço</span></h1>
        <p class="subtitulo">Acompanhe as ordens de serviço</p>

        <!-- pesquisa -->
        <form class="busca" id="formBusca" role="search">
            <input type="search" id="pesquisa" placeholder="pesquisa" aria-label="Pesquisar ordens de serviço" autocomplete="off">
            <button type="submit" aria-label="Pesquisar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"/>
                    <path d="M20 20l-3.5-3.5"/>
                </svg>
            </button>
        </form>

        <!-- nova ordem -->
        <div class="nova">
            <a href="./cadastroOS.html" aria-label="Cadastrar nova ordem de serviço" title="Nova OS">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
            </a>
        </div>

        <hr class="divisor">

        <!-- filtros -->
        <div class="filtros" role="group" aria-label="Filtrar por status">
            <button type="button" class="filtro" data-filtro="todas" aria-pressed="true">Todas</button>
            <button type="button" class="filtro" data-filtro="abertas" aria-pressed="false">Abertas</button>
            <button type="button" class="filtro" data-filtro="andamento" aria-pressed="false">Andamento</button>
            <button type="button" class="filtro" data-filtro="fechadas" aria-pressed="false">Fechadas</button>
            <button type="button" class="filtro" data-filtro="congeladas" aria-pressed="false">Congeladas</button>
        </div>

        <p class="resumo" id="resumo" role="status"></p>

        <!-- os cartões são criados pelo ordensProfissional.js a partir do modelo abaixo -->
        <section class="lista" id="lista"></section>
    </main>

    <template id="modeloCartao">
        <article class="cartao-os">
            <div class="linha-topo">
                <svg class="icone-grande" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M5 2h9l5 5v13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/>
                    <path fill="#1a1a1d" d="M8 10h8v1.6H8zm0 3.4h8V15H8zm0 3.4h5v1.6H8z"/>
                </svg>
                <div>
                    <p class="numero"></p>
                    <p class="legenda">Número da OS</p>
                </div>
            </div>

            <div class="linha-tecnico">
                <span class="avatar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </span>
                <div>
                    <p class="nome"></p>
                    <p class="legenda">Técnico</p>
                </div>
            </div>

            <p class="selo"><span class="ponto"></span><span class="selo-texto"></span></p>

            <div class="valor">
                <svg class="icone-valor" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M3 4a1 1 0 0 1 1-1h7.2a1 1 0 0 1 .7.3l9 9a1 1 0 0 1 0 1.4l-7.2 7.2a1 1 0 0 1-1.4 0l-9-9A1 1 0 0 1 3 11.2z"/>
                    <circle cx="8" cy="8" r="1.6" fill="#26262a"/>
                </svg>
                <div>
                    <p class="legenda">Valor da OS</p>
                    <p class="reais"></p>
                </div>
                <svg class="seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 5l7 7-7 7"/>
                </svg>
            </div>
        </article>
    </template>

    <script src="./frontend/js/ordens.js"></script>
    <script src="./frontend/js/ordensProfissional.js"></script>
</body>
</html>
