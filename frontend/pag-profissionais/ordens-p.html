<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordens de Serviço</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/css-profissionais/ordens-p.css">
    <link rel="icon" type="image/svg+xml" href="../files/svg/ícone.svg">

    <script src="../js/ordens-p.js" defer></script>
    <script src="../js/foto.js" defer></script>
</head>

<body>
    <header class="navbar">
        <a class="logo" href="/ordens-p">
            <img src="../files/svg/fixly.svg" alt="Logo do site fixly">
        </a>

        <nav class="menu">
            <a href="/home-p">Início</a>
            <a href="/ordens-p" class="ativo" aria-current="page">Ordens</a>
            <a href="/conversas-p">Conversas</a>
            <a href="/usuarios-p">Usuarios</a>
        </nav>

        <div class="acoes">
            <a class="sino" href="/noti-p" data-perfil="profissional" aria-label="Notificações">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                <span class="contador" hidden></span>
            </a>

             <a href="/perfil-p" class="topbar__avatar is-active" aria-label="Meu perfil">
        <img id="topbar-avatar-img" src="" alt="Foto de perfil" style="display: none; width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
        <svg id="topbar-avatar-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2c-4 0-8 2-8 5v1h16v-1c0-3-4-5-8-5Z"/></svg>
        </a>
        </div>
    </header>

    <main>
        <h1>Ordens de <span>Serviço</span></h1>
        <p class="subtitulo">Assuma novas ordens e acompanhe as suas</p>

        <!-- Provisório: sem login, o profissional informa o número dele. Depois, isso vem do login. -->
        <form class="identificar" id="formIdentificar" hidden>
            <p>Informe o seu número de identificação de profissional para continuar.</p>

            <div class="identificar-linha">
                <input type="text" id="campoNumero" placeholder="Número de identificação" aria-label="Número de identificação" autocomplete="off" required>
                <button type="submit">Continuar</button>
            </div>

            <p class="erro-id" id="erroId" role="alert"></p>
        </form>

        <div id="conteudo" hidden>
            <p class="identidade" id="identidade"></p>

            <!-- pesquisa -->
            <form class="busca" id="formBusca" role="search">
                <input type="search" id="pesquisa" placeholder="pesquisa" aria-label="Pesquisar ordens de serviço" autocomplete="off">
                <button type="submit" aria-label="Pesquisar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"/>
                        <path d="M20 20l-3.5-3.5"/>
                    </svg>
                </button>
            </form>

            <!-- nova ordem -->
            <div class="nova">
                <a href="./cadastroOS.html" aria-label="Cadastrar nova ordem de serviço" title="Nova OS">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                </a>
            </div>

            <hr class="divisor">

            <!-- as duas partes: ordens dele e ordens sem técnico -->
            <div class="abas" role="tablist" aria-label="Ordens">
                <button type="button" class="aba" role="tab" data-aba="minhas" aria-selected="true">
                    Minhas ordens <span class="contagem" id="contMinhas">0</span>
                </button>

                <button type="button" class="aba" role="tab" data-aba="sem" aria-selected="false">
                    Sem técnico <span class="contagem" id="contSem">0</span>
                </button>
            </div>

            <!-- filtros de status: só fazem sentido nas ordens dele -->
            <div class="filtros" id="filtros" role="group" aria-label="Filtrar por status">
                <button type="button" class="filtro" data-filtro="todas" aria-pressed="true">Todas</button>
                <button type="button" class="filtro" data-filtro="abertas" aria-pressed="false">Abertas</button>
                <button type="button" class="filtro" data-filtro="andamento" aria-pressed="false">Andamento</button>
                <button type="button" class="filtro" data-filtro="fechadas" aria-pressed="false">Fechadas</button>
                <button type="button" class="filtro" data-filtro="congeladas" aria-pressed="false">Congeladas</button>
            </div>

            <p class="resumo" id="resumo" role="status"></p>

            <!-- os cartões são criados pelo ordens-p.js a partir do modelo abaixo -->
            <section class="lista" id="lista"></section>
        </div>
    </main>

    <template id="modeloCartao">
        <article class="cartao-os">
            <div class="linha-topo">
                <svg class="icone-grande" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M5 2h9l5 5v13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/>
                    <path fill="#1a1a1d" d="M8 10h8v1.6H8zm0 3.4h8V15H8zm0 3.4h5v1.6H8z"/>
                </svg>
                <div>
                    <p class="numero"></p>
                    <p class="legenda">Número da OS</p>
                </div>
            </div>

            <div class="linha-tecnico">
                <span class="avatar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </span>
                <div>
                    <p class="nome"></p>
                    <p class="legenda">Técnico</p>
                </div>
            </div>

            <p class="selo"><span class="ponto"></span><span class="selo-texto"></span></p>

            <!-- o que o profissional precisa para decidir se assume -->
            <div class="detalhes">
                <p class="linha-info"><strong>Cliente</strong><span class="cliente"></span></p>
                <p class="linha-info"><strong>Equipamento</strong><span class="equipamento"></span></p>
                <p class="linha-info"><strong>Problema</strong><span class="problema"></span></p>
                <p class="linha-info"><strong>Abertura</strong><span class="abertura"></span></p>
            </div>

            <div class="valor">
                <svg class="icone-valor" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M3 4a1 1 0 0 1 1-1h7.2a1 1 0 0 1 .7.3l9 9a1 1 0 0 1 0 1.4l-7.2 7.2a1 1 0 0 1-1.4 0l-9-9A1 1 0 0 1 3 11.2z"/>
                    <circle cx="8" cy="8" r="1.6" fill="#26262a"/>
                </svg>
                <div>
                    <p class="legenda">Valor da OS</p>
                    <p class="reais"></p>
                </div>
            </div>

            <button type="button" class="assumir">Assumir ordem</button>
        </article>
    </template>

</body>
</html>
