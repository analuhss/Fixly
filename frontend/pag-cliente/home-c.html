<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixly</title>

    <!-- FONTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/css-cliente/inicio.css">

    <!-- ICONE -->
    <link rel="icon" type="image/svg+xml" href="../files/svg/ícone.svg">

    <!-- JS -->
        <script src="../js/home-c.js" defer></script>
        <script src="../js/foto.js" defer></script>

    
</head>
<body>
    <header class="navbar">
        <a class="logo" href="/home-c">
            <img src="../files/svg/fixly.svg" alt="Logo do site fixly">
        </a>

        <nav class="menu">
            <a href="/home-c" class="ativo">Início</a>
            <a href="/ordens-c">Ordens</a>            
            <a href="/conversa-c">Conversas</a>
        </nav>

         <a href="/perfil-c" class="perfil" aria-label="Meu perfil">
        <img id="topbar-avatar-img" src="" alt="Foto de perfil" style="display: none; width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
        <svg id="topbar-avatar-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2c-4 0-8 2-8 5v1h16v-1c0-3-4-5-8-5Z"/></svg>
        </a>
        

    </header>

    <main class="conteudo">
        <h1 class="boasVindas">Bem vindo ao <span>Fixly!</span></h1>

        <form class="busca">
            <label for="pesquisa" class="visual">Pesquisar</label>
            <input class="info" type="search" id="pesquisa" name="pesquisa" placeholder="pesquisa">
            
            <button type="submit" aria-label="Pesquisar">
                <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"/>
                    <path d="m20 20-3.5-3.5"/>
                </svg>
            </button>

        </form>

        <hr class="divisor">

        <section class="status">
            <h2>Status do <span>Serviço</span></h2>
            <p class="subtitulo">Acompanhe as ordens de serviço</p>
        </section>

        <!-- A ideia é que quando o usuário faça um pedido, esta parte desapareça-->
        <section class="pedidos">
            <h3>Pedidos recentes</h3>
            <p>Você não tem nenhum pedido recente</p>

            <div class="vazio">
                <button class="novo" type="click" aria-label="Criar nova ordem de serviço" id="ordem">
                    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" aria-hidden="true">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                </button>
            </div>
        </section>
    </main>
</body>
</html>
