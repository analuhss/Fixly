<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfil</title>

  <!-- FONTES -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="../css/css-adm/perfil-adm.css">

  <!-- ICONE -->
  <link rel="icon" type="image/svg+xml" href="../files/svg/ícone.svg">

  <!-- JS -->
  <script src="../js/perfil-adm.js" defer></script>
  <script src="../js/foto.js" defer></script>

</head>
<body>

  <header class="topbar">
    <a href="/home-adm" class="topbar__logo">
      <img src="../files/svg/fixly.svg" alt="Fixly" height="32">
    </a>
      
    <nav class="topbar__nav">
      <a href="/home-adm" >INÍCIO</a>
      <a href="/ordens-adm">ORDENS</a>
      <!-- <a href="/conversas-adm">CONVERSAS</a> -->
      <a href="/usuarios-adm" class="on" >USUÁRIOS</a>
    </nav>
    
      <a href="/perfil-adm" class="topbar__avatar is-active" aria-label="Meu perfil">
        <img id="topbar-avatar-img" src="" alt="Foto de perfil" style="display: none; width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
        <svg id="topbar-avatar-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2c-4 0-8 2-8 5v1h16v-1c0-3-4-5-8-5Z"/></svg>
        </a>
  </header>

  <main class="page">
    <h1 class="page__title">Meu <span>perfil</span></h1>
    <p class="page__subtitle">Gerencie seus dados pessoais e a segurança da conta</p>
    <hr class="page__divider">

    <div class="profile">

      <aside class="card card--identity">
        <div class="avatar">
          <!-- 1. ADICIONADO: Tag img para exibir a foto carregada ou selecionada -->
          <img id="avatar-img" src="" alt="Foto de perfil" style="display: none; width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
          
          <!-- 2. ALTERADO: Adicionado id="avatar-svg" para esconder o ícone quando houver foto -->
          <svg id="avatar-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2c-4 0-8 2-8 5v1h16v-1c0-3-4-5-8-5Z"/></svg>
          
          <!-- 3. ADICIONADO: Input de arquivo oculto -->
          <input type="file" id="input-foto" accept="image/*" hidden>
          
          <!-- 4. ALTERADO: Adicionado id="btn-alterar-foto" -->
          <button type="button" class="avatar__edit" id="btn-alterar-foto" aria-label="Alterar foto">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l1.5-2h7L17 7h3v12H4V7Zm8 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/></svg>
          </button>
        </div>
        <h2 class="identity__name">Anônimo</h2>
  
      </aside>

      <section class="card card--form">
        <h2 class="card__title">Dados da conta</h2>

        <form id="perfil-form" novalidate>
          <div class="field">
            <label for="nome">Nome</label>
            <div class="input">
              <input type="text" id="nome" name="nome" placeholder="Seu nome completo" autocomplete="name" readonly>
              <button type="button" class="input__edit" aria-label="Editar nome" data-target="nome">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.250V21h3.750L17.810 9.940l-3.750-3.750L3 17.250ZM20.710 7.040a1 1 0 0 0 0-1.410l-2.340-2.340a1 1 0 0 0-1.410 0l-1.830 1.830 3.750 3.750 1.830-1.830Z"/></svg>
              </button>
            </div>
          </div>

          <div class="field">
            <label for="cpf">CPF</label>
            <div class="input">
              <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" inputmode="numeric" maxlength="14" readonly>
              <button type="button" class="input__edit" aria-label="Editar CPF" data-target="cpf">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.250V21h3.750L17.810 9.940l-3.750-3.750L3 17.250ZM20.710 7.040a1 1 0 0 0 0-1.410l-2.340-2.340a1 1 0 0 0-1.410 0l-1.830 1.830 3.750 3.750 1.830-1.830Z"/></svg>
              </button>
            </div>
          </div>

          <div class="field">
            <label for="email">E-mail</label>
            <div class="input">
              <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" readonly>
              <button type="button" class="input__edit" aria-label="Editar e-mail" data-target="email">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.250V21h3.750L17.810 9.940l-3.750-3.750L3 17.250ZM20.710 7.040a1 1 0 0 0 0-1.410l-2.340-2.340a1 1 0 0 0-1.410 0l-1.830 1.830 3.750 3.750 1.830-1.830Z"/></svg>
              </button>
            </div>
          </div>

          <!-- 5. ALTERADO: Adicionados os IDs nos botões de ação -->
          <div class="actions">

</button>
            <button type="submit" class="btn btn--primary" id="salvar" disabled>Salvar alterações</button>
            <button type="button" class="btn btn--ghost" id="btn-abrir-senha">Alterar senha</button>
            
            <button type="button" class="btn btn--ghost btn--danger" id="btn-excluir">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
              Excluir Conta
            </button>

            <button type="button" class="btn btn--ghost btn--logout" id="btn-sair">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
              Sair da Conta
            </button>
          </div>

        </form>
      </section>

    </div>
  </main>

<!-- Janela Modal para alteração de senha -->
  <dialog id="modal-senha" style="background: var(--surface, #1a1a1d); color: var(--text, #fff); border: 1px solid var(--border, #2e2e33); border-radius: var(--radius, 16px); padding: 28px; margin: auto; width: min(400px, 90%);">
    <h3 style="margin-bottom: 20px; font-size: 18px;">Alterar Senha</h3>
    <form id="form-senha">
      <div class="field">
        <label for="senha-atual">Senha Atual</label>
        <div class="input" style="position: relative; display: flex; align-items: center;">
          <input type="password" id="senha-atual" placeholder="Digite sua senha atual" required style="width: 100%; padding-right: 42px; color: #18181b;">
          <button type="button" class="btn-olho-senha" data-alvo="senha-atual" aria-label="Mostrar ou ocultar senha atual" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: transparent !important; border: none !important; width: auto !important; height: auto !important; padding: 4px !important; cursor: pointer; display: flex; align-items: center; justify-content: center;">
            <svg width="20" height="20" viewBox="0 0 24 24" style="fill: none !important; stroke: #52525b !important; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="nova-senha">Nova Senha</label>
        <div class="input" style="position: relative; display: flex; align-items: center;">
          <input type="password" id="nova-senha" placeholder="Digite a nova senha" required style="width: 100%; padding-right: 42px; color: #18181b;">
          <button type="button" class="btn-olho-senha" data-alvo="nova-senha" aria-label="Mostrar ou ocultar nova senha" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: transparent !important; border: none !important; width: auto !important; height: auto !important; padding: 4px !important; cursor: pointer; display: flex; align-items: center; justify-content: center;">
            <svg width="20" height="20" viewBox="0 0 24 24" style="fill: none !important; stroke: #52525b !important; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="actions" style="margin-top: 24px;">
        <button type="button" class="btn btn--ghost" id="btn-fechar-modal">Cancelar</button>
        <button type="submit" class="btn btn--primary">Confirmar</button>
      </div>
    </form>
  </dialog>

</body>
</html>
