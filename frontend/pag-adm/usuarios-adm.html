<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/css-adm/usuarios.css">
    <link rel="icon" type="image/svg+xml" href="./files/svg/aplicativo/icone.svg">
</head>
<body>
    <header class="navbar">
        <a class="logo" href="./dashboard.html">
            <img src="../files/svg/fixly.svg" alt="Logo do site fixly">
        </a>

        <nav class="menu">
            <a href="/home-adm">Início</a>
            <a href="/ordens-html">Ordens</a>
            <a href="/conversas-adm">Conversas</a>
            <a href="/usuarios" class="ativo" aria-current="page">Usuários</a>
        </nav>

        <a class="perfil" href="./perfil.html" aria-label="Perfil">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <circle cx="12" cy="8.5" r="4.2"/>
                <path d="M3.5 22c0-4.7 3.8-7.5 8.5-7.5s8.5 2.8 8.5 7.5z"/>
            </svg>
        </a>
    </header>

    <main>
        <h1>Gestão de <span>Usuários</span></h1>
        <p class="subtitulo">Cadastre e acompanhe clientes e profissionais</p>

        <!-- pesquisa -->
        <form class="busca" id="formBusca" role="search">
            <input type="search" id="pesquisa" placeholder="pesquisa" aria-label="Pesquisar usuários" autocomplete="off">
            <button type="submit" aria-label="Pesquisar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"/>
                    <path d="M20 20l-3.5-3.5"/>
                </svg>
            </button>
        </form>

        <!-- novo usuário -->
        <div class="nova">
            <a href="./cadastroUsuario.html" aria-label="Cadastrar novo usuário" title="Novo usuário">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
            </a>
        </div>

        <hr class="divisor">

        <!-- filtros -->
        <div class="filtros" role="group" aria-label="Filtrar por tipo">
            <button type="button" class="filtro" data-filtro="todos" aria-pressed="true">Todos</button>
            <button type="button" class="filtro" data-filtro="clientes" aria-pressed="false">Clientes</button>
            <button type="button" class="filtro" data-filtro="profissionais" aria-pressed="false">Profissionais</button>
        </div>

        <p class="resumo" id="resumo" role="status"></p>

        <!-- os cartões são criados pelo usuariosAdmin.js a partir do modelo abaixo -->
        <section class="lista" id="lista"></section>
    </main>

    <template id="modeloCartao">
        <article class="cartao-usuario">
            <div class="linha-topo">
                <span class="avatar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </span>
                <div>
                    <p class="nome"></p>
                    <p class="legenda">Nº de identificação <span class="numero"></span></p>
                </div>
            </div>

            <p class="selo"><span class="ponto"></span><span class="selo-texto"></span></p>

            <div class="contatos">
                <p class="linha-info"><strong>E-mail</strong><span class="email"></span></p>
                <p class="linha-info"><strong>Telefone</strong><span class="telefone"></span></p>
                <p class="linha-info"><strong>CPF</strong><span class="cpf"></span></p>
            </div>

            <p class="rodape">Cadastrado em <span class="data"></span></p>
        </article>
    </template>

  
</body>
</html>
