<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <!-- FONTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style2.css">

    <!-- ÍCONE -->
    <link rel="icon" type="image/svg+xml" href="../files/svg/ícone.svg">

    <script src="../js/criarConta.js" defer></script>

</head>
<body>
    <main>
        <div class="card">
            <img class="logo" src="../files/svg/fixly.svg" alt="Logo do site Fixly">

            <form class="cadastro" id="cadastro">
                <div class="input">
                    <div class="campo email">
                        <label for="email" class="visual">E-mail</label>
                        <input class="info" type="email" id="email" name="email" placeholder="email" required>
                    </div>
                    <div class="campo senha">
                        <label for="password" class="visual">Senha</label>
                        <input class="info" type="password" id="senha" name="password" placeholder="senha" required minlength="6">
                    </div>

                    <div class="recomendacao">
                        <p>Escolha uma senha forte!</p>
                        <p>Letras maiúsculas, minúsculas, números e caracteres especiais</p>
                    </div>
                </div>

                <div class="entar">
                    <button type="submit">Criar</button>
                </div>
            </form>

            <div class="ou"><p>ou</p></div>

            <div class="footerconta">
                <p>Já tem uma conta?</p>
                <a href="/">Entre</a>
            </div>
        </div>
    </main>
</body>
</html>
