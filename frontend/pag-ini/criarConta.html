<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <!-- FONTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style2.css">

    <!-- ÍCONE -->
    <link rel="icon" type="image/svg+xml" href="../files/svg/ícone.svg">

    <script src="../js/notificacao.js" defer></script>
    <script src="../js/criarConta.js" defer></script>

</head>
<body>
    <main>
        <div class="card">
            <img class="logo" src="../files/svg/fixly.svg" alt="Logo do site Fixly">

            <form class="cadastro" id="cadastro">
                <div class="input">
                    <div class="campo email">
                        <label for="email" class="visual">E-mail</label>
                        <input class="info" type="email" id="email" name="email" placeholder="email" required>
                    </div>

                    <div class="campo senha" style="position: relative; display: flex; align-items: center;">
                        <label for="senha" class="visual">Senha</label>
                        <input class="info" type="password" id="senha" name="password" placeholder="senha" required minlength="8" style="width: 100%; padding-right: 42px; position: relative; z-index: 1;">
                        <button type="button" id="btn-olho-cadastro" aria-label="Mostrar ou ocultar senha" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); z-index: 10 !important; pointer-events: auto !important; background: transparent !important; border: none !important; width: auto !important; height: auto !important; padding: 6px !important; margin: 0 !important; cursor: pointer !important; display: flex; align-items: center; justify-content: center; box-shadow: none !important;">
                            <svg width="20" height="20" viewBox="0 0 24 24" style="pointer-events: none; fill: none !important; stroke: #52525b !important; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>

                    <div class="recomendacao">
                        <p>Escolha uma senha forte!</p>
                        <ul id="requisitos-senha" style="list-style: none; padding: 4px 0 0; margin: 0; font-size: 12px; text-align: left; display: flex; flex-direction: column; gap: 3px;">
                            <li id="req-tamanho">• Mínimo de 8 caracteres</li>
                            <li id="req-maiuscula">• Pelo menos 1 letra maiúscula</li>
                            <li id="req-minuscula">• Pelo menos 1 letra minúscula</li>
                            <li id="req-numero">• Pelo menos 1 número</li>
                            <li id="req-especial">• Pelo menos 1 caractere especial (!@#$...)</li>
                        </ul>
                    </div>
                </div>

                <div class="entar">
                    <button type="submit">Criar</button>
                </div>
            </form>

            <div class="ou"><p>ou</p></div>

            <div class="footerconta">
                <p>Já tem uma conta?</p>
                <a href="/">Entre</a>
            </div>
        </div>
    </main>
</body>
</html>
