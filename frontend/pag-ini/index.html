<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixly</title>

    <!-- ÍCONE -->
    <link rel="icon" type="image/svg+xml" href="../files/svg/ícone.svg">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- SCRIPT -->
    <script src="../js/login.js" defer></script>

</head>
<body>
    <main>
        <div class="card">
            <div class="logo">
                <img src="../files/svg/fixly.svg" alt="Logo do Fixly">
            </div>

            <form class="form-login" action="./home.html" method="post" autocomplete="on" id="form-login">
                <div class="input">
                    <div>
                        <label for="email" class="visually-hidden">E-mail</label>
                        <input class="info" type="email" id="email" name="email" placeholder="email" required>
                    </div>
                    <div>
                        <label for="password" class="visually-hidden">Senha</label>
                        <input class="info" type="password" id="senha" name="password" placeholder="senha" required>
                    </div>
                </div>

                <div class="entar">
                    <button type="submit">Entrar</button>
                </div>
            </form>

            <div class="ou"><p>ou</p></div>

            <div class="footerconta">
                <p>Ainda não tem uma conta?</p>
                <a href="/criar-conta">Crie uma</a>
            </div>
        </div>
    </main>
</body>
</html>
