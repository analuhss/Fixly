<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixly</title>

    <!-- ÍCONE -->
    <link rel="icon" type="image/svg+xml" href="../files/svg/ícone.svg">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- SCRIPT -->
    <script src="../js/login.js" defer></script>

</head>
<body>
    <main>
        <div class="card">
            <div class="logo">
                <img src="../files/svg/fixly.svg" alt="Logo do Fixly">
            </div>

            <form class="form-login" action="./home.html" method="post" autocomplete="on" id="form-login">
                <div class="input">
                    <div>
                        <label for="email" class="visually-hidden">E-mail</label>
                        <input class="info" type="email" id="email" name="email" placeholder="email" required>
                    </div>
                   <div style="position: relative; display: flex; align-items: center;">
    <label for="senha" class="visually-hidden">Senha</label>
    <input class="info" type="password" id="senha" name="password" placeholder="senha" required style="width: 100%; padding-right: 42px; position: relative; z-index: 1;">
    <button type="button" id="btn-olho-login" aria-label="Mostrar ou ocultar senha" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); z-index: 10 !important; pointer-events: auto !important; background: transparent !important; border: none !important; width: auto !important; height: auto !important; padding: 6px !important; margin: 0 !important; cursor: pointer !important; display: flex; align-items: center; justify-content: center; box-shadow: none !important;">
        <svg width="20" height="20" viewBox="0 0 24 24" style="pointer-events: none; fill: none !important; stroke: #52525b !important; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
        </svg>
    </button>
</div>
                </div>

                <div class="entar">
                    <button type="submit">Entrar</button>
                </div>
            </form>

            <div class="ou"><p>ou</p></div>

            <div class="footerconta">
                <p>Ainda não tem uma conta?</p>
                <a href="/criar-conta">Crie uma</a>
            </div>
        </div>
    </main>
</body>
</html>
